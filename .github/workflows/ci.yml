name: CI

# Este workflow NÃO publica. Quem publica é o Cloudflare Workers Builds, ligado
# ao repositório pelo painel da Cloudflare — ver README, seção Deploy.
# Aqui o objetivo é ter o resultado como check no GitHub (principalmente em PR),
# rodando exatamente os mesmos portões do build command da Cloudflare.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Mesma versão fixada em BUN_VERSION no Workers Builds, para os dois
          # lados resolverem o lockfile igual.
          bun-version: 1.3.13

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Build
        run: bun run build
